<title>Meridian — your session home</title>
<style>
  :root{
    --bg1:#F3EFFB; --bg2:#FBF8FF; --card:#FFFFFF;
    --ink:#332F45; --ink-dim:#8781A0; --ink-faint:#B3ADC8;
    --lavender:#8C7EE0; --lavender-deep:#6E5FCB; --lavender-soft:#E8E2FB;
    --mint:#5FC9AE; --mint-soft:#DCF5EC;
    --coral:#EE8C82; --coral-soft:#FCE4E1;
    --periwinkle:#7C97E8; --periwinkle-soft:#E4E9FB;
    --rose:#E56E8B; --rose-soft:#FBE3EA;
    --line:#ECE7F9;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 340px);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:inherit; font-weight:800; letter-spacing:-0.01em; }
  .mono{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; }
  button{ font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2.5px solid var(--lavender-deep); outline-offset:2px;
  }
  input,textarea{ font:inherit; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 16px 100px; }
  header.top{ padding:26px 0 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark{ width:40px; height:40px; border-radius:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--lavender),var(--periwinkle)); }
  .brand-name{ font-size:18px; line-height:1; }
  .brand-sub{ font-size:12px; color:var(--ink-faint); margin-top:3px; }
  .icon-btn{ width:38px; height:38px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .12s ease, background .15s ease; }
  .icon-btn:active{ transform:scale(.94); }
  .header-actions{ display:flex; align-items:center; gap:6px; }
  .btn-primary{ background:var(--lavender); color:#fff; }
  .btn-ghost{ background:var(--card); color:var(--ink-dim); box-shadow:inset 0 0 0 1.5px var(--line); }

  /* coach hint */
  .coach{ margin-bottom:14px; padding:11px 14px; border-radius:16px; background:var(--lavender-soft); color:var(--lavender-deep); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px; line-height:1.4; }
  .coach .dismiss{ flex-shrink:0; opacity:.65; width:26px; height:26px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
  .coach .dismiss:active{ transform:scale(.9); }

  /* recents */
  .recents-label{ font-size:11.5px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin:0 0 8px 2px; }
  .recents{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; scrollbar-width:none; }
  .recents::-webkit-scrollbar{ display:none; }
  .recent-chip{ flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:14px; background:var(--card); box-shadow:0 1px 4px rgba(140,126,224,.06),0 6px 16px rgba(140,126,224,.07); font-size:12.5px; font-weight:700; white-space:nowrap; max-width:220px; }
  .recent-chip .rc-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recent-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* breadcrumbs */
  .crumbs{ display:flex; align-items:center; gap:2px; overflow-x:auto; margin-bottom:14px; scrollbar-width:none; }
  .crumbs::-webkit-scrollbar{ display:none; }
  .crumb{ font-size:12.5px; font-weight:700; color:var(--ink-dim); padding:7px 11px; border-radius:12px; white-space:nowrap; flex-shrink:0; }
  .crumb.active{ background:var(--card); color:var(--lavender-deep); box-shadow:0 1px 4px rgba(140,126,224,.06); }
  .crumb.placeholder{ color:var(--ink-faint); font-weight:600; }
  .crumb-sep{ color:var(--ink-faint); flex-shrink:0; font-size:12px; padding:0 1px; }

  /* columns */
  .columns-viewport{ display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x proximity; padding:2px 2px 14px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; align-items:flex-start; }
  .columns-viewport::-webkit-scrollbar{ display:none; }
  .column{ flex:0 0 auto; width:min(78vw,268px); scroll-snap-align:start; display:flex; flex-direction:column; }
  .column.notes-col{ width:min(90vw,420px); }
  @media (min-width:760px){ .column{ width:236px; } .column.notes-col{ width:380px; } }
  .col-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 2px 10px; min-height:20px; }
  .col-title{ font-size:12px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .col-title strong{ color:var(--ink-dim); }
  .col-count{ font-size:11px; font-weight:700; color:var(--ink-faint); flex-shrink:0; }
  .col-list{ display:flex; flex-direction:column; gap:8px; }
  .col-scroll{ max-height:56vh; overflow-y:auto; padding-bottom:2px; }
  .col-empty{ padding:26px 10px; text-align:center; color:var(--ink-faint); font-size:12.5px; line-height:1.5; }

  .tile{ position:relative; display:flex; align-items:center; gap:10px; padding:12px 13px; border-radius:18px; background:var(--card); box-shadow:0 1px 4px rgba(140,126,224,.05),0 6px 16px rgba(140,126,224,.06); text-align:left; width:100%; transition:transform .1s, box-shadow .15s; }
  .tile:active{ transform:scale(.98); }
  .tile.selected{ box-shadow:0 0 0 2px var(--lavender-deep) inset; }
  .tile-avatar{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff; flex-shrink:0; letter-spacing:-.02em; }
  .tile-body{ min-width:0; flex:1; }
  .tile-name{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile-chev{ flex-shrink:0; opacity:.35; }
  .tile-menu{ flex-shrink:0; width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; opacity:.5; }
  .tile-menu:active{ opacity:1; transform:scale(.92); }
  .tile-add{ background:transparent; box-shadow:inset 0 0 0 1.6px var(--line); color:var(--ink-dim); justify-content:center; font-weight:700; font-size:13px; padding:12px; }
  .tile-add:active{ background:var(--card); }

  /* notes */
  .notes-toolbar{ display:flex; gap:8px; margin-bottom:10px; }
  .note-add-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:12px; border-radius:16px; background:var(--lavender); color:#fff; font-weight:700; font-size:13.5px; }
  .note-add-btn:active{ transform:scale(.98); }
  .copyall-btn{ width:44px; flex-shrink:0; border-radius:16px; background:var(--card); box-shadow:inset 0 0 0 1.5px var(--line); display:flex; align-items:center; justify-content:center; }
  .copyall-btn.copied{ background:var(--mint-soft); box-shadow:none; }
  .note-card{ background:var(--card); border-radius:20px; padding:14px 15px; box-shadow:0 1px 4px rgba(140,126,224,.05),0 6px 16px rgba(140,126,224,.06); }
  .note-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .note-title-row{ display:flex; align-items:center; gap:6px; min-width:0; }
  .note-title{ font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-meta{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .note-star{ flex-shrink:0; width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .note-star:active{ transform:scale(.9); }
  .note-body{ font-size:13.5px; color:var(--ink-dim); line-height:1.5; white-space:pre-wrap; word-break:break-word; max-height:4.6em; overflow:hidden; cursor:pointer; }
  .note-body.expanded{ max-height:none; }
  .note-actions{ display:flex; align-items:center; gap:6px; margin-top:11px; padding-top:11px; border-top:1px solid var(--line); }
  .note-copy-btn{ display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:12px; background:var(--lavender-soft); color:var(--lavender-deep); font-size:12px; font-weight:700; }
  .note-copy-btn.copied{ background:var(--mint-soft); color:#2f8a72; }
  .note-spacer{ flex:1; }
  .note-icon-btn{ width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .note-icon-btn:active{ transform:scale(.9); }

  .fab{ position:fixed; right:20px; bottom:24px; width:58px; height:58px; border-radius:50%; display:none; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--lavender),var(--periwinkle)); color:#fff; box-shadow:0 10px 26px rgba(140,126,224,.42); z-index:30; }
  .fab:active{ transform:scale(.94); }
  footer.foot{ text-align:center; font-size:12px; color:var(--ink-faint); padding:22px 20px 8px; line-height:1.6; }
  footer.foot button{ text-decoration:underline; color:var(--ink-dim); font-weight:600; }

  .overlay{ position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center; background:rgba(51,47,69,.45); backdrop-filter:blur(3px); }
  .sheet{ width:100%; max-width:480px; max-height:92vh; overflow-y:auto; background:var(--bg2); border-radius:32px 32px 0 0; }
  .sheet-head{ position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; padding:18px 20px; background:var(--bg2); border-bottom:1px solid var(--line); z-index:2; }
  .sheet-head h2{ font-size:17px; margin:0; }
  .sheet-body{ padding:18px 20px; display:flex; flex-direction:column; gap:16px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-faint); margin-bottom:6px; }
  .field input, .field textarea{ width:100%; background:var(--card); border:none; border-radius:16px; padding:12px 14px; font-size:15px; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); }
  .field textarea{ min-height:150px; line-height:1.5; resize:vertical; font-family:inherit; }
  .field input:focus, .field textarea:focus{ box-shadow:inset 0 0 0 2px var(--lavender); outline:none; }
  .swatch-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .swatch{ width:34px; height:34px; border-radius:50%; flex-shrink:0; transition:transform .1s; }
  .swatch:active{ transform:scale(.92); }
  .swatch.active{ box-shadow:0 0 0 3px var(--bg2), 0 0 0 5px var(--ink); }
  .form-error{ font-size:12.5px; color:var(--rose); font-weight:600; }
  .sheet-actions{ display:flex; gap:12px; padding:8px 20px 26px; }
  .btn-block{ flex:1; padding:14px; border-radius:18px; font-weight:800; text-align:center; }
  .btn-cancel{ background:var(--card); color:var(--ink-dim); }
  .btn-save{ background:var(--lavender); color:#fff; }
  .btn-save:disabled{ opacity:.5; pointer-events:none; }

  .search-row{ display:flex; align-items:center; gap:8px; background:var(--card); border-radius:16px; padding:11px 14px; box-shadow:inset 0 0 0 1.5px var(--line); }
  .search-row input{ flex:1; border:none; background:none; font-size:15px; color:var(--ink); }
  .search-row input:focus{ outline:none; }
  .search-hint{ font-size:12.5px; color:var(--ink-faint); padding:4px 2px; }
  .search-result{ display:block; width:100%; text-align:left; padding:13px 14px; border-radius:16px; background:var(--card); box-shadow:0 1px 4px rgba(140,126,224,.05); }
  .search-result:active{ transform:scale(.98); }
  .search-path{ font-size:11px; color:var(--ink-faint); margin-bottom:4px; font-weight:700; }
  .search-snip{ font-size:13.5px; color:var(--ink-dim); line-height:1.4; }
  mark{ background:var(--lavender-soft); color:var(--lavender-deep); border-radius:3px; padding:0 1px; font-weight:700; }

  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--line); font-size:14.5px; gap:10px; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .desc{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .settings-btn{ padding:9px 15px; border-radius:13px; background:var(--lavender-soft); color:var(--lavender-deep); font-weight:700; font-size:13px; flex-shrink:0; }
  .settings-btn.danger{ background:var(--rose-soft); color:var(--rose); }
  .settings-section-label{ font-size:11px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin:14px 2px 2px; }

  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(6px); background:var(--ink); color:#fff; padding:11px 20px; border-radius:14px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.22); z-index:90; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .empty-hero{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:64px 20px; }
  .empty-hero .empty-icon{ width:60px; height:60px; border-radius:20px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; background:linear-gradient(135deg,var(--lavender-soft),var(--periwinkle-soft)); }
  .empty-hero h2{ font-size:19px; margin:0 0 8px; }
  .empty-hero p{ font-size:14px; color:var(--ink-dim); max-width:280px; margin:0 0 20px; line-height:1.5; }
  .btn-cta{ padding:13px 22px; border-radius:16px; background:var(--lavender); color:#fff; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  .btn-cta:active{ transform:scale(.96); }

  input[type="file"]{ display:none; }
  @media (max-width:640px){ .fab{ display:flex; } }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* ---------- auth gate ---------- */
  .auth-wrap{ max-width:360px; margin:0 auto; padding:64px 20px 40px; min-height:100vh; display:flex; flex-direction:column; }
  .auth-mark{ width:52px; height:52px; border-radius:18px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--lavender),var(--periwinkle)); margin-bottom:18px; }
  .auth-wrap h1{ font-size:22px; margin:0 0 6px; }
  .auth-wrap p.sub{ font-size:13.5px; color:var(--ink-faint); margin:0 0 26px; line-height:1.5; }
  .auth-field{ margin-bottom:12px; }
  .auth-field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-dim); margin-bottom:6px; }
  .auth-field input{ width:100%; padding:13px 14px; border-radius:14px; background:var(--card); box-shadow:inset 0 0 0 1.5px var(--line); font-size:14px; color:var(--ink); }
  .auth-field input:focus{ box-shadow:inset 0 0 0 1.5px var(--lavender); outline:none; }
  .auth-submit{ width:100%; padding:14px; border-radius:16px; background:var(--lavender); color:#fff; font-weight:700; font-size:14.5px; margin-top:6px; }
  .auth-submit:active{ transform:scale(.98); }
  .auth-submit:disabled{ opacity:.55; }
  .auth-google{ width:100%; padding:13px; border-radius:16px; background:var(--card); box-shadow:inset 0 0 0 1.5px var(--line); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px; }
  .auth-google:active{ transform:scale(.98); }
  .auth-divider{ display:flex; align-items:center; gap:10px; color:var(--ink-faint); font-size:11.5px; font-weight:700; text-transform:uppercase; margin-bottom:16px; }
  .auth-divider::before, .auth-divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  .auth-switch{ text-align:center; font-size:13px; color:var(--ink-faint); margin-top:20px; }
  .auth-switch button{ color:var(--lavender-deep); font-weight:700; }
  .auth-error{ background:var(--rose-soft); color:var(--rose); font-size:12.5px; font-weight:600; padding:10px 13px; border-radius:12px; margin-bottom:14px; line-height:1.4; }
  .auth-notice{ background:var(--mint-soft); color:#2f8a72; font-size:12.5px; font-weight:600; padding:10px 13px; border-radius:12px; margin-bottom:14px; line-height:1.4; }
  .auth-loading{ display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--ink-faint); font-size:13.5px; font-weight:600; }
</style>
</head>

<script>
"use strict";

/* =========================================================
   Meridian — a private memory container for your AI sessions.
   Platform → Account → Session → Notes.
   Auth via Supabase (Google + email/password). Vault data itself
   still lives in local storage on this device — not yet synced
   to Supabase tables. No analytics, no other third-party scripts.
========================================================= */

/* ---------- supabase auth ---------- */
var SUPABASE_URL = "https://tjdrafrolobgkqrxitwq.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqZHJhZnJvbG9iZ2txcnhpdHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTE1MTgsImV4cCI6MjEwMjA2NzUxOH0.cGWTARlpAj4VYN8If80UKhu9W9X48hmx7ASW6thBz7c";

var authHost = document.getElementById("auth-host");
var authMode = "signin"; /* 'signin' | 'signup' */

function authGoogleIcon(){
  return '<svg width="17" height="17" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>';
}
function renderAuthScreen(errorMsg, noticeMsg){
  app.style.display = "none";
  var isSignup = authMode === "signup";
  authHost.innerHTML = "";
  var wrap = el("div", { class:"auth-wrap" });
  var mark = el("div", { class:"auth-mark" }); mark.innerHTML = svgIcon("sparkle", 22, "#fff");
  wrap.appendChild(mark);
  wrap.appendChild(el("h1", { class:"display", text: isSignup ? "Create your account" : "Welcome back" }));
  wrap.appendChild(el("p", { class:"sub", text: isSignup ? "Set up Meridian to sync your sessions across devices." : "Sign in to your Meridian account." }));
  if (errorMsg) wrap.appendChild(el("div", { class:"auth-error", text: errorMsg }));
  if (noticeMsg) wrap.appendChild(el("div", { class:"auth-notice", text: noticeMsg }));

  var googleBtn = el("button", { class:"auth-google", type:"button" });
  googleBtn.innerHTML = authGoogleIcon() + '<span>Continue with Google</span>';
  googleBtn.addEventListener("click", signInWithGoogle);
  wrap.appendChild(googleBtn);

function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function el(tag, attrs, children){
  var n = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs){
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}

/* ---------- storage adapter: works inside Claude AND standalone ---------- */
function hasClaudeStorage(){
  return !!(window.storage && typeof window.storage.get === "function" && typeof window.storage.set === "function");
}
async function storageGet(key){
  if (hasClaudeStorage()){
    try { var r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try { return window.localStorage.getItem(key); } catch(e){ return null; }
}
async function storageSet(key, value){
  if (hasClaudeStorage()){
    try { var r = await window.storage.set(key, value, false); return !!r; }
    catch(e){ return false; }
  }
  try { window.localStorage.setItem(key, value); return true; } catch(e){ return false; }
}

/* ---------- clipboard (with graceful fallback) ---------- */
async function copyText(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e){ /* fall through */ }
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch(e){ return false; }
}

/* ---------- time formatting ---------- */
function timeAgo(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  var s = Math.max(0, Math.floor((Date.now()-d.getTime())/1000));
  if (s < 45) return "just now";
  var m = Math.floor(s/60); if (m < 60) return m+"m ago";
  var h = Math.floor(m/60); if (h < 24) return h+"h ago";
  var dd = Math.floor(h/24); if (dd < 7) return dd+"d ago";
  var w = Math.floor(dd/7); if (w < 5) return w+"w ago";
  return d.toLocaleDateString(undefined,{ month:"short", day:"numeric" });
}

/* ---------- vault sanitizing (defends against corrupted/edited storage) ---------- */
function sanitizePlatform(p){
  if (!p || typeof p !== "object") return null;
  return {
    id: String(p.id||uid("p")).slice(0,64),
    name: String(p.name||"Untitled").slice(0,40),
    color: typeof p.color === "string" ? p.color : "var(--lavender)",
    soft: typeof p.soft === "string" ? p.soft : "var(--lavender-soft)",
    builtin: !!p.builtin,
    createdAt: p.createdAt || new Date().toISOString()
  };
}
function sanitizeAccount(a){
  if (!a || typeof a !== "object") return null;
  return {
    id: String(a.id||uid("a")).slice(0,64),
    platformId: String(a.platformId||""),
    name: String(a.name||"Untitled account").slice(0,60),
    createdAt: a.createdAt || new Date().toISOString()
  };
}
function sanitizeSession(s){
  if (!s || typeof s !== "object") return null;
  return {
    id: String(s.id||uid("s")).slice(0,64),
    accountId: String(s.accountId||""),
    name: String(s.name||"Untitled session").slice(0,60),
    createdAt: s.createdAt || new Date().toISOString(),
    updatedAt: s.updatedAt || s.createdAt || new Date().toISOString()
  };
}
function sanitizeNote(n){
  if (!n || typeof n !== "object") return null;
  return {
    id: String(n.id||uid("n")).slice(0,64),
    sessionId: String(n.sessionId||""),
    title: String(n.title||"").slice(0,80),
    body: String(n.body||"").slice(0,20000),
    pinned: !!n.pinned,
    createdAt: n.createdAt || new Date().toISOString(),
    updatedAt: n.updatedAt || n.createdAt || new Date().toISOString()
  };
}
function emptyVault(){
  return { platforms: BUILTIN_PLATFORMS.map(function(p){ return Object.assign({},p,{createdAt:new Date().toISOString()}); }),
    accounts: [], sessions: [], notes: [], recents: [], coachDismissed: false };
}
function sanitizeVault(raw){
  var v = emptyVault();
  if (!raw || typeof raw !== "object") return v;
  if (Array.isArray(raw.platforms)){
    var custom = raw.platforms.map(sanitizePlatform).filter(Boolean).filter(function(p){ return !p.builtin; });
    var builtinIds = BUILTIN_PLATFORMS.map(function(p){ return p.id; });
    var keptBuiltins = raw.platforms.map(sanitizePlatform).filter(Boolean).filter(function(p){ return builtinIds.indexOf(p.id) !== -1; });
    v.platforms = BUILTIN_PLATFORMS.map(function(bp){
      var found = keptBuiltins.find(function(k){ return k.id === bp.id; });
      return found || Object.assign({}, bp, { createdAt:new Date().toISOString() });
    }).concat(custom);
  }
  if (Array.isArray(raw.accounts)) v.accounts = raw.accounts.map(sanitizeAccount).filter(Boolean);
  if (Array.isArray(raw.sessions)) v.sessions = raw.sessions.map(sanitizeSession).filter(Boolean);
  if (Array.isArray(raw.notes)) v.notes = raw.notes.map(sanitizeNote).filter(Boolean);
  if (Array.isArray(raw.recents)) v.recents = raw.recents.filter(function(r){ return r && r.sessionId; }).slice(0,RECENTS_CAP);
  v.coachDismissed = !!raw.coachDismissed;
  return v;
}

/* ---------- derived getters ---------- */
function platformById(id){ return vault.platforms.find(function(p){ return p.id===id; }); }
function accountById(id){ return vault.accounts.find(function(a){ return a.id===id; }); }
function sessionById(id){ return vault.sessions.find(function(s){ return s.id===id; }); }
function accountsFor(platformId){
  return vault.accounts.filter(function(a){ return a.platformId===platformId; })
    .sort(function(a,b){ return a.name.localeCompare(b.name); });
}
function sessionsFor(accountId){
  return vault.sessions.filter(function(s){ return s.accountId===accountId; })
    .sort(function(a,b){ return new Date(b.updatedAt)-new Date(a.updatedAt); });
}
function notesFor(sessionId){
  return vault.notes.filter(function(n){ return n.sessionId===sessionId; })
    .sort(function(a,b){
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return new Date(b.updatedAt)-new Date(a.updatedAt);
    });
}

/* ---------- persistence ---------- */
async function persist(){

function pushRecent(sessionId){
  vault.recents = vault.recents.filter(function(r){ return r.sessionId !== sessionId; });
  vault.recents.unshift({ sessionId:sessionId, ts:new Date().toISOString() });

/* ---------- generic bottom sheet ---------- */
function openSheet(titleText, bodyEl, buildActions){
  var overlay = el("div", { class:"overlay", id:"overlay" });
  var sheet = el("div", { class:"sheet" });
  var head = el("div", { class:"sheet-head" }, [
    el("h2", { class:"display", text:titleText }),
    el("button", { class:"icon-btn", type:"button", "aria-label":"Close", style:"background:var(--card)", onclick:closeSheet }, [])
  ]);
  head.querySelector("button").innerHTML = svgIcon("x", 18, "var(--ink-faint)");
  sheet.appendChild(head);
  sheet.appendChild(bodyEl);
  if (buildActions){
    var actions = el("div", { class:"sheet-actions" });
    buildActions(actions, closeSheet);
    sheet.appendChild(actions);
  }
  overlay.appendChild(sheet);
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeSheet(); });
  document.addEventListener("keydown", escListener);
  document.body.appendChild(overlay);
  return closeSheet;
}
function escListener(e){ if (e.key === "Escape") closeSheet(); }
function closeSheet(){
  var overlay = document.getElementById("overlay");
  if (overlay) overlay.remove();
  document.removeEventListener("keydown", escListener);
}

      if (!name){ errorLine.textContent = "Give the session a name."; return; }
      if (isEdit){
        existing.name = name.slice(0,60);
        existing.updatedAt = new Date().toISOString();
        persist();
      } else {
        var now = new Date().toISOString();
        var s = sanitizeSession({ id:uid("s"), accountId:accountId, name:name, createdAt:now, updatedAt:now });
        vault.sessions.push(s);
        selectSession(s.id);
      }
      close();
    });
    actions.appendChild(saveBtn);
  });
  window.setTimeout(function(){ nameInput.focus(); }, 30);
}
function deleteSession(id){
  var s = sessionById(id);
  if (!s) return;
  if (!window.confirm('Delete "'+s.name+'" and its notes? This can\'t be undone.')) return;
  vault.notes = vault.notes.filter(function(n){ return n.sessionId!==id; });
  vault.sessions = vault.sessions.filter(function(s2){ return s2.id!==id; });
  vault.recents = vault.recents.filter(function(r){ return r.sessionId!==id; });
  if (sel.sessionId===id) sel.sessionId=null;
  persist();
  showToast("Session deleted");
}

/* ---------- forms: note ---------- */
function openNoteForm(sessionId, existing){
  var isEdit = !!existing;
  var body = el("div", { class:"sheet-body" });
  var titleField = el("div", { class:"field" }, [ el("label", { text:"Title (optional)" }) ]);
  var titleInput = el("input", { type:"text", maxlength:"80", placeholder:"e.g. System prompt draft, Context to paste", value: existing ? existing.title : "" });
  titleField.appendChild(titleInput);
  body.appendChild(titleField);

  var bodyField = el("div", { class:"field" }, [ el("label", { text:"Note" }) ]);
  var bodyInput = el("textarea", { placeholder:"Paste or write what you want to keep — ready to copy back into a prompt later." });
  bodyInput.value = existing ? existing.body : "";
  bodyField.appendChild(bodyInput);
  body.appendChild(bodyField);

  var errorLine = el("div", { class:"form-error" });
  body.appendChild(errorLine);

  openSheet(isEdit ? "Edit note" : "Add a note", body, function(actions, close){
    actions.appendChild(el("button", { type:"button", class:"btn-block btn-cancel", text:"Cancel", onclick:close }));
    var saveBtn = el("button", { type:"button", class:"btn-block btn-save", text: isEdit ? "Save changes" : "Add note" });
    saveBtn.addEventListener("click", function(){
      var text = bodyInput.value.trim();
      if (!text){ errorLine.textContent = "The note can't be empty."; return; }
      var now = new Date().toISOString();
      if (isEdit){
        existing.title = titleInput.value.trim().slice(0,80);
        existing.body = text.slice(0,20000);
        existing.updatedAt = now;
      } else {
        var n = sanitizeNote({ id:uid("n"), sessionId:sessionId, title:titleInput.value.trim(), body:text, pinned:false, createdAt:now, updatedAt:now });
        vault.notes.push(n);
      }
      touchSession(sessionId);
      focusColumn = "notes";
      persist();
      close();
      showToast(isEdit ? "Note updated" : "Note added");
    });
    actions.appendChild(saveBtn);
  });
  window.setTimeout(function(){ (existing ? bodyInput : titleInput).focus(); }, 30);
}
function deleteNote(id){
  var n = vault.notes.find(function(n2){ return n2.id===id; });
  if (!n) return;
  if (!window.confirm("Delete this note? This can't be undone.")) return;
  vault.notes = vault.notes.filter(function(n2){ return n2.id!==id; });
  persist();
  showToast("Note deleted");
}
function toggleNotePin(id){
  var n = vault.notes.find(function(n2){ return n2.id===id; });
  if (!n) return;
  n.pinned = !n.pinned;
  persist();
}
async function copyNote(id, btnEl){
  var n = vault.notes.find(function(n2){ return n2.id===id; });
  if (!n) return;
  var ok = await copyText(n.body);
  if (ok){
    showToast("Copied to clipboard");
    if (btnEl){ btnEl.classList.add("copied"); window.setTimeout(function(){ btnEl.classList.remove("copied"); }, 1200); }
  } else {
    showToast("Couldn't copy — try selecting the text manually");
  }
}
async function copyAllNotes(sessionId, btnEl){
  var notes = notesFor(sessionId);
  if (notes.length === 0) return;
  var text = notes.map(function(n){ return n.title ? ("## "+n.title+"\n"+n.body) : n.body; }).join("\n\n---\n\n");
  var ok = await copyText(text);
  if (ok){
    showToast("Copied all "+notes.length+" notes");
    if (btnEl){ btnEl.classList.add("copied"); window.setTimeout(function(){ btnEl.classList.remove("copied"); }, 1200); }
  } else {
    showToast("Couldn't copy — try again");
  }
}

/* ---------- delegated clicks ---------- */
document.addEventListener("click", function(e){
  var t = e.target;

  var pinBtn = t.closest("[data-pin]"); if (pinBtn){ toggleNotePin(pinBtn.getAttribute("data-pin")); return; }
  var copyBtn = t.closest("[data-copy]"); if (copyBtn){ copyNote(copyBtn.getAttribute("data-copy"), copyBtn); return; }
  var editNoteBtn = t.closest("[data-edit-note]"); if (editNoteBtn){ var nn = vault.notes.find(function(n){ return n.id===editNoteBtn.getAttribute("data-edit-note"); }); if (nn) openNoteForm(nn.sessionId, nn); return; }
  var delNoteBtn = t.closest("[data-delete-note]"); if (delNoteBtn){ deleteNote(delNoteBtn.getAttribute("data-delete-note")); return; }
  var expandBtn = t.closest("[data-expand]"); if (expandBtn){ var id = expandBtn.getAttribute("data-expand"); expandedNotes[id] = !expandedNotes[id]; renderColumns(); return; }

  var editBtn = t.closest("[data-edit]");
  if (editBtn){
    var kind = editBtn.getAttribute("data-edit"), id2 = editBtn.getAttribute("data-id");
    if (kind==="account"){ var acc = accountById(id2); if (acc) openAccountForm(acc.platformId, acc); }
    if (kind==="session"){ var sess = sessionById(id2); if (sess) openSessionForm(sess.accountId, sess); }
    return;
  }
  var delBtn = t.closest("[data-delete]");
  if (delBtn){
    var kind2 = delBtn.getAttribute("data-delete"), id3 = delBtn.getAttribute("data-id");
    if (kind2==="platform") deletePlatform(id3);
    if (kind2==="account") deleteAccount(id3);
    if (kind2==="session") deleteSession(id3);
    return;
  }

  var selBtn = t.closest("[data-select]");
  if (selBtn){
    var kind3 = selBtn.getAttribute("data-select"), id4 = selBtn.getAttribute("data-id");
    if (kind3==="platform") selectPlatform(id4);
    if (kind3==="account") selectAccount(id4);
    if (kind3==="session") selectSession(id4);
    return;
  }

  if (t.closest("#add-platform-btn")) { openPlatformForm(); return; }
  if (t.closest("[data-add-account]")) { openAccountForm(sel.platformId, null); return; }
  if (t.closest("[data-add-session]")) { openSessionForm(sel.accountId, null); return; }
  if (t.closest("#add-note-btn")) { openNoteForm(sel.sessionId, null); return; }
  if (t.closest("#copyall-btn")) { copyAllNotes(sel.sessionId, t.closest("#copyall-btn")); return; }

  var recentChip = t.closest("[data-recent-jump]"); if (recentChip){ jumpToSession(recentChip.getAttribute("data-recent-jump")); return; }

  var crumbBtn = t.closest("[data-crumb]");
  if (crumbBtn){
    var which = crumbBtn.getAttribute("data-crumb");
    var scrollTargetId = which==="platforms" ? "col-platforms" : which==="accounts" ? "col-accounts" : "col-sessions";
    var scrollTarget = document.getElementById(scrollTargetId);
    if (scrollTarget) scrollTarget.scrollIntoView({ behavior:"smooth", inline:"start", block:"nearest" });
    return;
  }
});

/* ---------- global search ---------- */
function openSearch(){
  var body = el("div", { class:"sheet-body" });
  var row = el("div", { class:"search-row" });
  row.innerHTML = svgIcon("search",16,"var(--ink-faint)");
  var input = el("input", { type:"text", placeholder:"Search sessions and notes…" });
  row.appendChild(input);
  body.appendChild(row);
  var resultsHost = el("div", { class:"col-list", style:"margin-top:14px;" });
  body.appendChild(resultsHost);

  function runSearch(q){
    q = q.trim().toLowerCase();
    if (!q){ resultsHost.innerHTML = '<div class="search-hint">Type to search across every note, session, and account.</div>'; return; }
    var results = [];
    vault.notes.forEach(function(n){
      var hay = (n.title+" "+n.body).toLowerCase();
      if (hay.indexOf(q) !== -1){
        var s = sessionById(n.sessionId); if (!s) return;
        var a = accountById(s.accountId); if (!a) return;
        var p = platformById(a.platformId); if (!p) return;
        var idx = n.body.toLowerCase().indexOf(q);
        var snippetStart = Math.max(0, idx-40);
        var raw = n.body.slice(snippetStart, snippetStart+140);
        results.push({ path:p.name+" › "+a.name+" › "+s.name, snippet: (snippetStart>0?"…":"")+raw+(snippetStart+140<n.body.length?"…":""), sessionId:s.id, title:n.title });
      }
    });
    vault.sessions.forEach(function(s){
      if (s.name.toLowerCase().indexOf(q) !== -1){
        var a2 = accountById(s.accountId); if (!a2) return;
        var p2 = platformById(a2.platformId); if (!p2) return;
        results.push({ path:p2.name+" › "+a2.name, snippet:s.name, sessionId:s.id, title:null, isSession:true });
      }
    });
    if (results.length === 0){ resultsHost.innerHTML = '<div class="search-hint">No matches for "'+esc(q)+'".</div>'; return; }
    resultsHost.innerHTML = results.slice(0,30).map(function(r){
      var snip = esc(r.snippet).replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"), "<mark>$1</mark>");
      return '<button type="button" class="search-result" data-search-jump="'+esc(r.sessionId)+'"><div class="search-path">'+esc(r.path)+'</div><div class="search-snip">'+(r.title?("<strong>"+esc(r.title)+":</strong> "):"")+snip+'</div></button>';
    }).join("");
  }
  input.addEventListener("input", function(){ runSearch(input.value); });
  runSearch("");

  var close = openSheet("Search", body, null);
  resultsHost.addEventListener("click", function(e){
    var btn = e.target.closest("[data-search-jump]");
    if (!btn) return;
    jumpToSession(btn.getAttribute("data-search-jump"));
    close();
  });
  window.setTimeout(function(){ input.focus(); }, 30);
}

/* ---------- export / import (resilience: storage can vanish) ---------- */
function exportData(){
  var payload = JSON.stringify(vault, null, 2);
  var blob = new Blob([payload], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "meridian-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("Backup exported");
}
function importData(file){
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try { parsed = JSON.parse(String(reader.result)); }
    catch(e){ window.alert("That file isn't valid JSON."); return; }
    var clean = sanitizeVault(parsed);
    if (!window.confirm("Import this backup? It will replace everything currently stored.")) return;
    vault = clean;
    sel = { platformId:null, accountId:null, sessionId:null };
    persist();
    closeSheet();
    showToast("Backup imported");
  };
  reader.onerror = function(){ window.alert("Couldn't read that file."); };
  reader.readAsText(file);
}

/* ---------- static shell (built once) ---------- */
function buildShell(){
  app.innerHTML = "";
  var header = el("header", { class:"top" }, [
    el("div", { class:"brand" }, [
      el("div", { class:"brand-mark" }),
      el("div", {}, [
        el("div", { class:"brand-name display", text:"Meridian" }),
        el("div", { class:"brand-sub", text:"your session home" })
      ])
    ]),
    el("div", { class:"header-actions" }, [
      el("button", { class:"icon-btn btn-ghost", type:"button", "aria-label":"Search", id:"search-btn" }),
      el("button", { class:"icon-btn btn-ghost", type:"button", "aria-label":"Settings", id:"settings-btn" })
    ])
  ]);
  header.querySelector(".brand-mark").innerHTML = svgIcon("sparkle", 18, "#fff");
  var actionBtns = header.querySelectorAll(".header-actions .icon-btn");
  actionBtns[0].innerHTML = svgIcon("search", 16, "var(--ink-dim)");
  actionBtns[1].innerHTML = svgIcon("gear", 16, "var(--ink-dim)");
  actionBtns[0].addEventListener("click", openSearch);
  actionBtns[1].addEventListener("click", openSettings);

  app.appendChild(header);
  app.appendChild(el("div", { id:"banner-host" }));
  app.appendChild(el("div", { id:"coach-host" }));
  app.appendChild(el("div", { id:"recents-host" }));
  app.appendChild(el("div", { id:"crumbs-host" }));
  app.appendChild(el("div", { id:"columns-host" }));
  app.appendChild(el("footer", { class:"foot" }, [
    document.createTextNode("Data is stored only in this browser, on this device — Meridian remembers everything until you clear or delete it. "),
    (function(){ var b = el("button", { type:"button", text:"Export a backup" }); b.addEventListener("click", exportData); return b; })(),
    document.createTextNode(" before clearing your cache or switching devices.")
  ]));

  fabBtn.innerHTML = svgIcon("plus", 24, "#fff");
  fabBtn.addEventListener("click", function(){ if (sel.sessionId) openNoteForm(sel.sessionId, null); });

  var toastHost = el("div", { class:"toast", id:"toast-host" });
  document.body.appendChild(toastHost);

  importInput.addEventListener("change", function(){
    if (importInput.files && importInput.files[0]) importData(importInput.files[0]);
    importInput.value = "";
  });
}

/* ---------- boot ---------- */
var appBooted = false;
async function bootApp(){
  if (appBooted) return;
  appBooted = true;
  authHost.innerHTML = "";
  app.style.display = "";
  buildShell();
  var raw = await storageGet(STORAGE_KEY);
  var parsed = null;
  if (raw){ try { parsed = JSON.parse(raw); } catch(e){ console.warn("Meridian: stored data was corrupted — starting fresh instead of crashing."); } }
  vault = sanitizeVault(parsed);
  loaded = true;
  renderAll();
  window.setInterval(function(){
    /* keep "time ago" labels fresh without a full re-render churn */
    if (sel.sessionId || sel.accountId) renderColumns();
    renderRecents();
  }, 60000);
}
function showSignedOut(){
  appBooted = false;
  app.style.display = "none";
  app.innerHTML = "";
  authMode = "signin";
  renderAuthScreen();
}

async function initAuth(){
  renderAuthLoading();
  var res = await sb.auth.getSession();
  if (res.data && res.data.session){ bootApp(); }
  else { renderAuthScreen(); }

  sb.auth.onAuthStateChange(function(event, session){
    if (session && !appBooted){ bootApp(); }
    else if (!session && appBooted){ showSignedOut(); }
  });
}
initAuth();
</script>
